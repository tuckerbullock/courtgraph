name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      # Force every uv command in this job onto the matrix interpreter,
      # overriding the committed .python-version (3.13).
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.7"
          enable-cache: true

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Verify lockfile is current
        run: uv lock --locked

      - name: Install from clean environment
        run: uv sync --locked

      - name: Verify interpreter matches matrix
        run: |
          uv run python -c "
          import sys
          expected = tuple(int(p) for p in '${{ matrix.python-version }}'.split('.'))
          actual = sys.version_info[:2]
          assert actual == expected, f'interpreter {actual} != matrix {expected}'
          print('interpreter OK:', sys.version)
          "

      - name: Health check (courtgraph doctor)
        run: uv run courtgraph doctor

      - name: Unit tests
        run: uv run python -m unittest discover -s tests -v

      - name: Python compilation
        run: uv run python -m compileall -q src tests

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy
