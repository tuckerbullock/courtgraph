[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "courtgraph"
version = "0.1.0"
description = "Research-grade NBA lineup chemistry modeling and evaluation."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Tucker Bullock" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []

[project.scripts]
courtgraph = "courtgraph.cli:main"

[dependency-groups]
dev = [
  "ruff==0.16.5",
  "mypy==2.3.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/courtgraph"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
mypy_path = "src"
strict = true
