[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "courtgraph"
version = "0.2.0"
description = "Research-grade NBA lineup chemistry modeling and evaluation."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Tucker Bullock" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy==2.3.5",
]

[project.scripts]
courtgraph = "courtgraph.cli:main"

[dependency-groups]
# Offline NBA snapshot -> stint ingestion. pbpstats is used only as a file-mode
# possession/lineup reconstruction tool (DATA_SOURCES.md SRC-PBPSTATS): its
# ``pbpstats.com`` hosted archive is never used. ``courtgraph ingest`` lazily
# imports it; ``courtgraph doctor`` and the chemistry path never do.
ingest = [
  "pbpstats==1.3.11",
]
dev = [
  "ruff==0.16.5",
  "mypy==2.3.1",
  { include-group = "ingest" },
]

[tool.hatch.build.targets.wheel]
packages = ["src/courtgraph"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
mypy_path = "src"
strict = true

[[tool.mypy.overrides]]
# pbpstats ships no type information; the ingest adapter keeps its use behind a
# typed boundary (courtgraph.ingest.possessions).
module = ["pbpstats.*"]
ignore_missing_imports = true
